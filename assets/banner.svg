<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.05);opacity:.8}}@keyframes float-particle{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.bg{fill:url(#bg-grad)}.grid-line{stroke:#334155;stroke-width:.5;stroke-dasharray:4,4;opacity:.4}.pulse-wave,.pulse-wave-2{stroke:#38bdf8;stroke-width:2;fill:none;opacity:.6}.pulse-wave-2{stroke:#f43f5e;opacity:.5}.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;text-anchor:middle}.title{font-weight:800;font-size:48px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-family:monospace;font-size:14px;fill:#38bdf8}.animated-pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}.particle{animation:float-particle 3s ease-in-out infinite}</style><rect width="1200" height="300" class="bg" rx="16"/><g opacity=".3"><line x1="0" x2="1200" y1="50" y2="50" class="grid-line"/><line x1="0" x2="1200" y1="100" y2="100" class="grid-line"/><line x1="0" x2="1200" y1="150" y2="150" class="grid-line"/><line x1="0" x2="1200" y1="200" y2="200" class="grid-line"/><line x1="0" x2="1200" y1="250" y2="250" class="grid-line"/></g><path d="M 50,220 Q 150,220 200,220 T 250,180 T 270,260 T 290,140 T 310,230 T 350,220 L 550,220 Q 650,220 700,220 T 750,190 T 770,250 T 790,150 T 810,230 T 850,220 L 1150,220" class="pulse-wave animated-pulse"/><path d="M 50,80 L 350,80 T 390,50 T 410,120 T 430,40 T 450,90 L 850,80 T 890,60 T 910,110 T 930,50 L 1150,80" class="pulse-wave-2 animated-pulse"/><circle cx="290" cy="140" r="4" fill="#38bdf8" class="particle" filter="url(#glow)"/><circle cx="790" cy="150" r="4" fill="#38bdf8" class="particle" filter="url(#glow)"/><circle cx="430" cy="40" r="4" fill="#f43f5e" class="particle" filter="url(#glow)"/><g transform="translate(600, 135)"><rect width="280" height="32" x="-140" y="-85" fill="#1e293b" stroke="#475569" stroke-width="1" rx="16"/><text x="0" y="-64" class="badge-text" text-anchor="middle">⚡ PHARMACOVIGILANCE &amp; SAFETY</text><text x="0" y="5" class="title" filter="url(#glow)">Awesome Drug Safety Management</text><text x="0" y="45" class="subtitle">Curated SaaS Platforms &amp; Open-Source Projects for Adverse Event Reporting &amp; Signal Detection</text></g><rect width="800" height="3" x="200" y="275" fill="url(#text-grad)" opacity=".8" rx="1.5"/></svg>